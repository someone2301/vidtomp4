<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vidtomp4</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
  form { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  select { padding: .6rem; font-size: 1rem; }
  label { display: flex; gap: .3rem; align-items: center; }
  input[type=url] { flex: 1 1 100%; padding: .6rem; font-size: 1rem; }
  button { padding: .6rem 1rem; font-size: 1rem; cursor: pointer; }
  progress { width: 100%; margin-top: 1rem; }
  #status { margin-top: 1rem; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>vidtomp4</h1>
<p>Paste a video or playlist URL. Videos are saved as MP4 with audio. Playlists download as a zip.</p>
<form id="f">
  <input id="url" type="url" placeholder="https://..." required>
  <select id="quality" aria-label="Quality">
    <option value="144">144p</option>
    <option value="240">240p</option>
    <option value="360" selected>360p</option>
    <option value="480">480p</option>
    <option value="720">720p</option>
    <option value="1080">1080p</option>
    <option value="best">Best available</option>
  </select>
  <label><input id="playlist" type="checkbox"> Whole playlist</label>
  <button id="go">Convert</button>
  <button id="cancel" type="button" hidden>Cancel</button>
</form>
<progress id="bar" max="100" value="0" hidden></progress>
<div id="status"></div>
<script>
const $ = id => document.getElementById(id);
let jobId = null;
$("cancel").onclick = async () => {
  if (!jobId) return;
  $("cancel").disabled = true;
  await fetch(`/api/jobs/${jobId}/cancel`, {method: "POST"});
};
const finish = () => { $("go").disabled = false; $("cancel").hidden = true; jobId = null; };
$("f").onsubmit = async e => {
  e.preventDefault();
  $("go").disabled = true; $("bar").hidden = false; $("bar").value = 0;
  $("status").textContent = "Queued...";
  const r = await fetch("/api/jobs", {method: "POST", headers: {"Content-Type": "application/json"},
                                     body: JSON.stringify({url: $("url").value, quality: $("quality").value,
                                                           playlist: $("playlist").checked})});
  const j = await r.json();
  if (!r.ok) { $("status").textContent = j.error; $("go").disabled = false; return; }
  jobId = j.id; $("cancel").hidden = false; $("cancel").disabled = false;
  const poll = setInterval(async () => {
    const s = await (await fetch(`/api/jobs/${j.id}`)).json();
    $("bar").value = s.progress || 0;
    $("status").textContent = s.status + (s.items ? ` (video ${s.item} of ${s.items})` : "")
                              + (s.title ? ": " + s.title : "");
    if (s.status === "done") {
      clearInterval(poll); finish();
      $("status").innerHTML = "";
      const a = document.createElement("a");
      a.href = `/api/jobs/${j.id}/file`; a.textContent = s.count > 1 ? `Download ${s.title || "playlist"} (${s.count} videos, zip)`
                                  : "Download " + (s.title || "video") + ".mp4";
      $("status").appendChild(a); a.click();
    } else if (s.status === "error") {
      clearInterval(poll); finish();
      $("status").textContent = "Error: " + s.error;
    } else if (s.status === "cancelled") {
      clearInterval(poll); finish();
      $("bar").hidden = true;
      $("status").textContent = "Cancelled.";
    }
  }, 1000);
};
</script>
</body>
</html>
