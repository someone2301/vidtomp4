<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vidtomp4</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
  form { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  select { padding: .6rem; font-size: 1rem; }
  label { display: flex; gap: .3rem; align-items: center; }
  #limit { width: 5rem; padding: .5rem; font-size: 1rem; }
  input[type=url], input[type=search] { flex: 1 1 100%; padding: .6rem; font-size: 1rem; }
  button { padding: .6rem 1rem; font-size: 1rem; cursor: pointer; }
  progress { width: 100%; margin-top: 1rem; }
  #status { margin-top: 1rem; white-space: pre-wrap; }
  #jobs { margin-top: 2rem; }
  .jobs-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .5rem; }
  .jobs-head button, .job button { padding: .35rem .7rem; font-size: .9rem; }
  .job .actions { margin-top: .5rem; display: flex; gap: .75rem; align-items: center; }
  .job { border: 1px solid #ccc; border-radius: 6px; padding: .75rem; margin-bottom: .75rem; }
  .job .top { display: flex; justify-content: space-between; gap: .5rem; align-items: baseline; }
  .job .name { font-weight: 600; overflow-wrap: anywhere; }
  .job .meta, .job .url { font-size: .85rem; color: #555; overflow-wrap: anywhere; }
  .job progress { margin-top: .5rem; }
  .job .err { color: #b00020; font-size: .9rem; overflow-wrap: anywhere; }
</style>
</head>
<body>
<h1>vidtomp4</h1>
<p>Paste a video, playlist or YouTube channel URL. Videos are saved as MP4 with audio. Playlists, channels and searches download as a zip. To get only matching videos from a channel, paste the channel URL and type a search.</p>
<form id="f">
  <input id="url" type="url" placeholder="https://..." required>
  <select id="quality" aria-label="Quality">
    <option value="144">144p</option>
    <option value="240">240p</option>
    <option value="360" selected>360p</option>
    <option value="480">480p</option>
    <option value="720">720p</option>
    <option value="1080">1080p</option>
    <option value="best">Best available</option>
  </select>
  <input id="search" type="search" placeholder="Search this channel (optional)" aria-label="Search this channel">
  <label><input id="playlist" type="checkbox"> Whole playlist</label>
  <label>Max videos <input id="limit" type="number" min="0" step="1" value="{{ max_playlist }}"
         title="Most videos to download from a playlist, channel or search. 0 = no limit."></label>
  <button id="go">Convert</button>
</form>
<div id="status"></div>
<section id="jobs">
  <div class="jobs-head">
    <h2>Jobs</h2>
    <span>
      <button id="clear-cancelled" type="button">Clear cancelled &amp; failed</button>
      <button id="clear-all" type="button">Clear all finished</button>
    </span>
  </div>
  <p id="empty">No jobs yet.</p>
  <div id="list"></div>
</section>
<script>
const $ = id => document.getElementById(id);
// Jobs started from this browser tab; their file downloads automatically when ready.
const mine = new Set();
const opened = new Set();
const ACTIVE = new Set(["queued", "downloading", "processing", "searching page",
                        "searching channel", "cancelling"]);

function fmtBytes(n) {
  if (!n) return "0 B";
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(i ? 1 : 0) + " " + u[i];
}
function fmtTime(sec) {
  if (sec == null) return "";
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${s}s` : `${s}s`;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;  // textContent, never innerHTML: titles come from other sites
  return e;
}

function describe(j) {
  const parts = [];
  if (j.items) parts.push(`video ${j.item} of ${j.items}`);
  if (j.status === "downloading") {
    const got = (j.finished_bytes || 0) + (j.downloaded || 0);
    const total = j.total ? (j.finished_bytes || 0) + j.total : null;
    parts.push(total ? `${fmtBytes(got)} of ${fmtBytes(total)}` : fmtBytes(got));
    if (j.speed) parts.push(fmtBytes(j.speed) + "/s");
    if (j.eta != null) parts.push(fmtTime(j.eta) + " left" + (j.items > 1 ? " (this video)" : ""));
  } else if (j.status === "done") {
    parts.push(fmtBytes(j.size));
  } else if (j.status === "processing") {
    parts.push("converting, time unknown");
  }
  if (j.items > 1) {
    const whole = [];
    if (j.playlist_size) whole.push("about " + fmtBytes(j.playlist_size) + " total");
    if (j.playlist_eta != null) whole.push("about " + fmtTime(j.playlist_eta) + " left");
    if (whole.length) parts.push("Whole playlist: " + whole.join(", "));
  }
  return parts.join(" · ");
}

function render(list) {
  $("empty").hidden = list.length > 0;
  const box = $("list");
  box.replaceChildren();
  for (const j of list) {
    const card = el("div", "job");
    const top = el("div", "top");
    top.append(el("span", "name", j.title || (j.search ? `Search: ${j.search}` : "Untitled")),
               el("span", "meta", `${j.status} · ${j.quality === "best" ? "best" : j.quality + "p"}`));
    card.append(top, el("div", "url", j.url + (j.items > 1 || j.search ? ` · max ${j.limit || "unlimited"} videos` : "")));
    if (ACTIVE.has(j.status)) {
      const bar = el("progress");
      bar.max = 100;
      if (j.status === "downloading") bar.value = j.progress || 0;  // no value = animated "busy" bar
      card.append(bar);
    }
    const info = describe(j);
    if (info) card.append(el("div", "meta", info));
    if (j.status === "error") card.append(el("div", "err", j.error));
    const actions = el("div", "actions");
    if (ACTIVE.has(j.status) && j.status !== "cancelling") {
      const b = el("button", null, "Cancel");
      b.onclick = async () => { b.disabled = true; await fetch(`/api/jobs/${j.id}/cancel`, {method: "POST"}); refresh(); };
      actions.append(b);
    }
    if (j.status === "done") {
      const a = el("a", null, j.count > 1 ? `Download zip (${j.count} videos)` : "Download MP4");
      a.href = `/api/jobs/${j.id}/file`;
      actions.append(a);
      if (mine.has(j.id) && !opened.has(j.id)) { opened.add(j.id); a.click(); }
    }
    if (!ACTIVE.has(j.status)) {
      const b = el("button", null, j.status === "done" ? "Remove" : "Clear");
      b.title = "Remove from the list and delete its files from the server";
      b.onclick = async () => { b.disabled = true; await fetch(`/api/jobs/${j.id}`, {method: "DELETE"}); refresh(); };
      actions.append(b);
    }
    if (actions.childElementCount) card.append(actions);
    box.append(card);
  }
}

async function refresh() {
  try {
    const r = await fetch("/api/jobs");
    if (r.ok) render(await r.json());
  } catch (e) { /* server restarting; try again next tick */ }
}

$("f").onsubmit = async e => {
  e.preventDefault();
  $("go").disabled = true;
  $("status").textContent = "Starting...";
  try {
    const r = await fetch("/api/jobs", {method: "POST", headers: {"Content-Type": "application/json"},
                                       body: JSON.stringify({url: $("url").value, quality: $("quality").value,
                                                             playlist: $("playlist").checked,
                                                             search: $("search").value,
                                                             limit: Number($("limit").value || 0)})});
    const j = await r.json();
    if (!r.ok) { $("status").textContent = j.error; return; }
    mine.add(j.id);
    $("status").textContent = "";
    $("url").value = ""; $("search").value = "";
    refresh();
  } finally {
    $("go").disabled = false;
  }
};

$("clear-cancelled").onclick = async () => { await fetch("/api/jobs/clear", {method: "POST"}); refresh(); };
$("clear-all").onclick = async () => {
  if (!confirm("Remove all finished jobs? Their files will be deleted from the server.")) return;
  await fetch("/api/jobs/clear?all=1", {method: "POST"});
  refresh();
};

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
